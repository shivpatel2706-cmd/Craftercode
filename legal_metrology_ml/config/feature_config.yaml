# Feature Configuration for Legal Metrology ML Verification Engine

target: "verification_result"
target_classes: ["PASS", "FAIL"]

instrument_types:
  - "Electronic Weighing Machine"
  - "Mechanical Weighing Machine"
  - "Weighbridge / Truck Scale"
  - "Crane / Hanging Scale"
  - "Counting Scale"
  - "Price Computing Scale"
  - "Precision / Analytical Balance"

accuracy_classes:
  - "I"    # Special accuracy
  - "II"   # High accuracy
  - "III"  # Medium accuracy
  - "IIII" # Ordinary accuracy

categorical_features:
  - "instrument_type"
  - "manufacturer"
  - "model"
  - "accuracy_class"
  - "physical_condition"
  - "display_condition"
  - "platform_condition"
  - "seal_condition"
  - "instrument_age_bucket"

boolean_features:
  - "tampering_indicator"
  - "display_functioning"
  - "previous_certificate_available"
  - "previous_certificate_valid"

numerical_features:
  - "capacity"
  - "scale_interval"
  - "instrument_age_years"
  - "previous_verifications"
  - "previous_failures"
  - "repair_count"
  - "last_verification_days_ago"
  - "certificate_expired_days"
  - "reference_load_1"
  - "observed_reading_1"
  - "error_1"
  - "reference_load_2"
  - "observed_reading_2"
  - "error_2"
  - "reference_load_3"
  - "observed_reading_3"
  - "error_3"
  - "repeatability_reading_1"
  - "repeatability_reading_2"
  - "repeatability_reading_3"
  - "repeatability_reading_4"
  - "repeatability_reading_5"
  - "repeatability_mean"
  - "repeatability_range"
  - "repeatability_std"
  - "center_reading"
  - "front_left_reading"
  - "front_right_reading"
  - "back_left_reading"
  - "back_right_reading"
  - "eccentric_max_error"
  - "eccentric_min_error"
  - "eccentric_range"
  - "eccentric_max_deviation_from_center"
  - "initial_zero"
  - "final_zero"
  - "zero_drift"
  - "tare_reference"
  - "tare_observed"
  - "tare_error"
  - "sensitivity_test_load"
  - "sensitivity_indication_change"
  - "sensitivity_error"

engineered_features:
  - "absolute_error_1"
  - "absolute_error_2"
  - "absolute_error_3"
  - "relative_error_1"
  - "relative_error_2"
  - "relative_error_3"
  - "maximum_absolute_error"
  - "mean_absolute_error"
  - "maximum_relative_error"
  - "zero_drift_absolute"
  - "tare_error_absolute"
  - "historical_failure_rate"
  - "certificate_expiry_risk"

mandatory_fields:
  - "instrument_type"
  - "accuracy_class"
  - "capacity"
  - "scale_interval"
  - "reference_load_1"
  - "observed_reading_1"
  - "reference_load_2"
  - "observed_reading_2"
  - "reference_load_3"
  - "observed_reading_3"
  - "repeatability_reading_1"
  - "repeatability_reading_2"
  - "repeatability_reading_3"
  - "center_reading"
  - "front_left_reading"
  - "initial_zero"
  - "final_zero"
